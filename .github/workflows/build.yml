name: Build and commit artifacts
on:
  push:
    branches: [main]
    paths-ignore: ['dist/**', 'build/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          APP_KEYS: ci-only-dummy-key
          API_TOKEN_SALT: ci-only-dummy-salt
          ADMIN_JWT_SECRET: ci-only-dummy-secret
          JWT_SECRET: ci-only-dummy-secret
          TRANSFER_TOKEN_SALT: ci-only-dummy-salt
          ENCRYPTION_KEY: ci-only-dummy-key-1234567890123456
      - name: Commit artifacts
        run: |
          git config user.email "ci@productsm3.local"
          git config user.name "ci-bot"
          git add -f dist build
          git diff --staged --quiet || git commit -m "ci: rebuild artifacts [skip ci]"
          git push
